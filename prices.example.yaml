# Prices for lure compare --prices: USD per million tokens.
#
# Check current pricing before you rely on these numbers:
#   https://platform.claude.com/docs/en/about-claude/pricing
# Rates change, and Lure ships no built-in price table. Copy this file,
# check every rate, and pass it with --prices. A cost is only an estimate
# from the tokens recorded in each run.
#
# Keys: input, output (required); cache_write, cache_read (needed only if
# runs used prompt caching). Model names match the target or judge, with or
# without the provider prefix (claude-sonnet-5-5 or anthropic:claude-sonnet-5-5).
# A local model (Ollama) can be listed at 0.

as_of: 2026-10-23

models:
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_write: 5.00   # 1.25x input, 5-minute cache
    cache_read: 0.20
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50   # 1.25x input, 5-minute cache
    cache_read: 0.20
  claude-haiku-5-5:
    input: 0.10        # prompts up to 100K tokens
    output: 0.50
