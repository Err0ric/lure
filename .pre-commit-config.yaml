# Secret scanning before each commit: gitleaks on the staged changes only.
#   pip install pre-commit && pre-commit install
# Pinned to the commit of gitleaks v8.30.1. CI runs gitleaks on the full
# history too (.github/workflows/ci.yml). Allowed findings: .gitleaksignore,
# and CONTRIBUTING.md, "Secret scanning".
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
