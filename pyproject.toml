[project]
name = "lure"
version = "1.14.2"
description = "Harness that tests AI agents for prompt injection and tool abuse"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=2.1",
    "httpx2>=2.16",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
lure = "lure.cli:main"

[project.optional-dependencies]
# rfc3339-validator lets jsonschema check the date-time format in tests.
# pillow builds the brand images (scripts/make_brand.py); not needed to run Lure.
# duckdb powers the optional results store and lure serve (lure store, lure serve).
store = ["duckdb>=1.1"]
dev = ["jsonschema>=4.23", "pytest>=8", "pillow>=11", "rfc3339-validator>=0.1.4", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lure*"]

[tool.setuptools.package-data]
"lure.arcanum" = ["taxonomy.json", "LICENSE.md", "SOURCE.md"]
"lure.judge" = ["rubric.md"]
"lure.report" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ollama and not docker'"
markers = [
    "ollama: smoke test against a live local Ollama server (run with: pytest -m ollama)",
    "loopback: may open sockets to 127.0.0.1 only (the lure serve tests)",
    "docker: builds Lure's images and runs the sandbox in Docker; skipped without Docker (run with: pytest -m docker)",
]
