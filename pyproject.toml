[project]
name = "lure"
version = "0.0.1"
description = "Harness that tests AI agents for prompt injection and tool abuse"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
