[project]
name = "lure"
version = "0.0.1"
description = "Harness that tests AI agents for prompt injection and tool abuse"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1",
    "httpx2>=2.16",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
lure = "lure.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lure*"]

[tool.setuptools.package-data]
"lure.judge" = ["rubric.md"]
"lure.report" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ollama'"
markers = [
    "ollama: smoke test against a live local Ollama server (run with: pytest -m ollama)",
]
