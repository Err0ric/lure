# Lint, tests and a secret scan on every push and pull request.
# No model API calls: no key is set, and tests/conftest.py blocks sockets.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  test:
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # store adds DuckDB, so the results store and lure serve tests run too.
      - run: pip install -e ".[dev,store]"
      # pyproject's addopts deselects the live Ollama smoke test.
      - run: pytest

  # The sandbox for real agents: builds Lure's own two images (the base is
  # pinned by digest) and proves the isolation with a scripted model. No
  # model API is called and no key is set.
  sandbox:
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ""
      LURE_AGENT_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: docker version
      # Fails, rather than skips, if Docker is missing here.
      - run: python -c "from lure.sandbox.docker import docker_available as d; assert d()"
      - run: pytest -m docker
      - name: Nothing left behind
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=lure.sandbox)"
          test -z "$(docker network ls -q --filter label=lure.sandbox)"

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
