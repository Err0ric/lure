# Example: retest an approved agent every week and when its profile changes.
# Not run in this repo. See docs/vetting-workflow.md.
#
# Copy to .github/workflows/lure-retest.yml in a PRIVATE repository that
# holds Lure's files at its root plus the vetting state, committed on purpose
# (remove these lines from its .gitignore):
#   profiles/<name>.yaml               the agent's profile (its real prompt)
#   results/<name>/<timestamp>/        at least the approved run folder
#   vetting/<name>/decisions.jsonl     the decision log (lure decide)
#   prices.yaml                        checked rates, for --max-cost
#
# The job never records a decision and never commits: the approver reads the
# approval page from the artifact, then runs lure decide and commits.
#
# Exit codes from lure retest:
#   0  no new failure
#   1  a new failure against the approved run (a regression)
#   2  a run errored, or bad input
#   3  stopped at --max-cost; the comparison is partial
#
# Every action is pinned to the commit SHA of a release, version in the
# comment (latest releases checked on 2026-10-23). Update them together.

name: Lure weekly retest

on:
  schedule:
    - cron: "0 6 * * 1"     # Mondays 06:00 UTC
  push:
    branches: [main]
    paths:
      - "profiles/**"
      - "lure.yaml"
      - "attacks/**"
  workflow_dispatch:

permissions:
  contents: read

# One retest at a time, so two runs never write the same results folder.
concurrency:
  group: lure-retest
  cancel-in-progress: false

env:
  PROFILE: profiles/example-ap-agent.yaml
  NAME: example-ap-agent        # the profile's name:, its folder under results/

jobs:
  retest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # Keep going on a regression so the report is still written; the last
      # step turns the code into the result.
      - name: Retest
        id: retest
        env:
          # Only the target's key, from the account approved for this agent's
          # prompt. Scope it to this job.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          code=0
          lure retest "$PROFILE" --prices prices.yaml --max-cost 2.00 || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The new run folder is the latest one, once it has a retest.json.
          run=$(ls -d "results/$NAME"/*/ 2>/dev/null | sort | tail -n 1)
          if [ -n "$run" ] && [ -f "${run}retest.json" ]; then
            echo "run=${run%/}" >> "$GITHUB_OUTPUT"
          fi

      # The approval page of the new run: what the retest compared with and
      # found, and which conditions it verified. A retest with nothing left to
      # run has no records for a page; retest.json is the record then.
      - name: Approval page
        if: always() && steps.retest.outputs.run != ''
        run: |
          run="${{ steps.retest.outputs.run }}"
          lure report "$run" --out "$run/report.html" \
            --approval "$run/approval.html" --approval-md "$run/approval.md" || true
          if [ -f "$run/approval.md" ]; then cat "$run/approval.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the new run
        if: always() && steps.retest.outputs.run != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lure-retest-${{ env.NAME }}
          path: ${{ steps.retest.outputs.run }}
          retention-days: 90

      - name: Gate on the retest
        if: always()
        run: |
          case "${{ steps.retest.outputs.code }}" in
            0) echo "Lure: no new failure against the approved run" ;;
            1) echo "::error::Lure: new failure against the approved run; the approver must decide again"; exit 1 ;;
            3) echo "::error::Lure: stopped at --max-cost; the comparison is partial"; exit 1 ;;
            *) echo "::error::Lure: a run errored or bad input; see the Retest step"; exit 2 ;;
          esac
